<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    let db = null;
    let auth = null;
    let currentUser = null;
    let unsubscribeSync = null;

    // 発行された設定情報
    const firebaseConfig = {
      apiKey: "AIzaSyBsHC08SEyU5m6uaVqXB_dIbvvUPnp5Aik",
      authDomain: "keigo-s-study-progress-tracker.firebaseapp.com",
      projectId: "keigo-s-study-progress-tracker",
      storageBucket: "keigo-s-study-progress-tracker.firebasestorage.app",
      messagingSenderId: "268317449138",
      appId: "1:268317449138:web:c77f859d8cf9db520322ab",
      measurementId: "G-T5NMYSY3ML"
    };

    window.currentRoomId = window.currentRoomId || 'tanaka-family';

    // Firestoreへの保存処理
    window.dbSaveTasks = async function(tasksToSave) {
      const room = window.currentRoomId || 'tanaka-family';
      if (!db || !currentUser) {
        localStorage.setItem(`kanban_tasks_${room}`, JSON.stringify(tasksToSave));
        return;
      }
      try {
        const docRef = doc(db, 'study_rooms', room);
        await setDoc(docRef, {
          tasks: tasksToSave,
          updatedAt: Date.now()
        }, { merge: true });
      } catch (err) {
        console.error("Firestore save error:", err);
      }
    };

    window.switchRoom = function(newRoomId) {
      if (!newRoomId) return;
      window.currentRoomId = newRoomId.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
      localStorage.setItem('kanban_last_room_id', window.currentRoomId);
      const displayElem = document.getElementById('currentRoomDisplay');
      if (displayElem) displayElem.textContent = window.currentRoomId;
      setupRealtimeListener();
      if (typeof window.showToast === 'function') {
        window.showToast(`🏠 合言葉「${window.currentRoomId}」に接続しました`);
      }
    };

    async function initCloudSync() {
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const roomParam = hashParams.get('room');
      if (roomParam) {
        window.currentRoomId = roomParam;
      } else {
        const savedRoom = localStorage.getItem('kanban_last_room_id');
        if (savedRoom) window.currentRoomId = savedRoom;
      }
      const displayElem = document.getElementById('currentRoomDisplay');
      if (displayElem) displayElem.textContent = window.currentRoomId;

      try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        // 匿名認証で接続
        await signInAnonymously(auth);

        onAuthStateChanged(auth, (user) => {
          currentUser = user;
          if (user) {
            const syncText = document.getElementById('syncStatusText');
            if (syncText) syncText.textContent = 'リアルタイム同期中';
            setupRealtimeListener();
          }
        });
      } catch (e) {
        console.error("Cloud init fallback:", e);
        const syncText = document.getElementById('syncStatusText');
        if (syncText) syncText.textContent = 'オフライン保存モード';
        if (typeof window.loadLocalTasks === 'function') window.loadLocalTasks();
      }
    }

    function setupRealtimeListener() {
      if (!db || !currentUser) return;
      if (unsubscribeSync) unsubscribeSync();

      const room = window.currentRoomId || 'tanaka-family';
      const docRef = doc(db, 'study_rooms', room);

      unsubscribeSync = onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data && Array.isArray(data.tasks) && typeof window.setTasksFromCloud === 'function') {
            window.setTasksFromCloud(data.tasks);
          }
        } else {
          if (typeof window.initDefaultTasks === 'function') window.initDefaultTasks();
        }
      }, (error) => {
        console.error("Sync listener error:", error);
      });
    }

    window.addEventListener('DOMContentLoaded', initCloudSync);
  </script>
